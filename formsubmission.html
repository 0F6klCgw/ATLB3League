<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commander League Point Sheet — Season 5</title>
<style>
  :root{
    --bg:#0f1117; --panel:#171a23; --panel2:#1e222d; --line:#2a2f3d;
    --text:#e7e9ee; --muted:#9aa2b1; --accent:#5b8cff;
    --pos:#2ecc71; --posbg:#173a29; --neg:#ff6b6b; --negbg:#3a1a1a; --dq:#ff3b3b; --dqbg:#4a1414;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{padding:20px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
  .header-inner{max-width:900px;margin:0 auto;display:flex;align-items:flex-start;gap:16px}
  .header-inner .titles{flex:1;min-width:0}
  header h1{margin:0 0 4px;font-size:20px}
  header p{margin:0;color:var(--muted);font-size:13px}
  .menu-btn{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 14px;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap}
  .menu-btn:hover{border-color:var(--accent);color:var(--accent)}
  .wrap{max-width:900px;margin:0 auto;padding:16px}
  .row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .field{flex:1 1 220px;display:flex;flex-direction:column;gap:4px}
  .field label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .field input{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 12px;font-size:15px}
  .commander-wrap{position:relative}
  .ac-dropdown{position:absolute;top:100%;left:0;right:0;z-index:20;background:var(--panel2);border:1px solid var(--line);border-radius:8px;margin-top:4px;max-height:260px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .ac-item{padding:9px 12px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--line)}
  .ac-item:last-child{border-bottom:0}
  .ac-item:hover,.ac-item.active{background:var(--accent);color:#fff}
  .cmdr-previews{display:flex;gap:14px;flex-wrap:wrap;margin:4px 0 16px}
  .cmdr-card{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;width:158px}
  .cmdr-card img{width:132px;border-radius:8px;background:#000}
  .cmdr-card .cn{font-weight:600;font-size:14px;text-align:center;line-height:1.3;word-break:break-word}
  .cmdr-clear{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px}
  .cmdr-hint{color:var(--muted);font-size:12px;text-transform:none;letter-spacing:0}
  .gametabs{display:flex;gap:6px;margin:8px 0 16px}
  .gametab{flex:1;padding:10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--muted);cursor:pointer;text-align:center;font-weight:600}
  .gametab.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .gametab .gt-total{display:block;font-size:12px;font-weight:400;margin-top:2px}
  .section{margin-bottom:22px}
  .section h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:6px;margin:0 0 10px}
  .placement{display:flex;gap:8px;flex-wrap:wrap}
  .plbtn{flex:1 1 90px;padding:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;cursor:pointer;text-align:center;font-weight:600}
  .plbtn.active{background:var(--posbg);border-color:var(--pos);color:var(--pos)}
  .pt{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;margin-bottom:8px;cursor:pointer;user-select:none}
  .pt:hover{border-color:#3a4152}
  .pt .val{flex:0 0 46px;text-align:center;font-weight:700;font-size:15px;padding:4px 0;border-radius:6px;background:#242938}
  .pt .desc{flex:1;font-size:13.5px;color:var(--text)}
  .pt.pos.active{background:var(--posbg);border-color:var(--pos)}
  .pt.pos.active .val{background:var(--pos);color:#04240f}
  .pt.neg.active{background:var(--negbg);border-color:var(--neg)}
  .pt.neg.active .val{background:var(--neg);color:#2a0606}
  .pt.dq.active{background:var(--dqbg);border-color:var(--dq)}
  .pt.dq.active .val{background:var(--dq);color:#fff}
  .pt .val.dqval{color:var(--dq)}
  .footer{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:14px 16px;margin-top:20px}
  .footerwrap{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .grand{font-size:15px}
  .grand b{font-size:22px}
  .grand .dqflag{color:var(--dq);font-weight:700;margin-left:10px}
  .spacer{flex:1}
  button.act{padding:12px 20px;border-radius:8px;border:0;font-size:15px;font-weight:600;cursor:pointer}
  button.submit{background:var(--accent);color:#fff}
  button.reset{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
  button.link{background:transparent;color:var(--accent);border:1px solid var(--line)}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0c2a17;border:1px solid var(--pos);color:var(--pos);padding:12px 20px;border-radius:8px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%}
  .toast.err{background:#2a0c0c;border-color:var(--neg);color:var(--neg)}
  .toast.show{opacity:1}
  .hidden{display:none}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="titles">
      <h1>Commander League Point Sheet</h1>
      <p>Season 5 · Tap each point you earned, for each game. Placement, standard, rotating &amp; bad-guy points included.</p>
    </div>
    <a class="menu-btn" href="/" title="Back to home">Home</a>
  </div>
</header>

<div class="wrap">
  <div class="row">
    <div class="field"><label for="fullName">Full Name</label><input id="fullName" placeholder="Player name" autocomplete="off"></div>
    <div class="field"><label for="leagueDate">Date</label><input id="leagueDate" type="date"></div>
  </div>

  <div class="row">
    <div class="field commander-wrap" style="flex:1 1 100%">
      <label for="commander">Commander</label>
      <input id="commander" placeholder="Start typing a commander… (powered by Scryfall)" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list">
      <div class="ac-dropdown hidden" id="acDropdown" role="listbox"></div>
    </div>
  </div>
  <div class="row">
    <div class="field commander-wrap" style="flex:1 1 100%">
      <label for="partner">Partner / Background <span class="cmdr-hint">(optional)</span></label>
      <input id="partner" placeholder="Second commander, partner, or background…" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list">
      <div class="ac-dropdown hidden" id="acDropdownP" role="listbox"></div>
    </div>
  </div>
  <div class="cmdr-previews" id="cmdrPreviews">
    <div class="cmdr-card hidden" id="cmdrPreview">
      <img id="cmdrImg" alt="Commander card">
      <div class="cn" id="cmdrName"></div>
      <button type="button" class="cmdr-clear" id="cmdrClear">Clear</button>
    </div>
    <div class="cmdr-card hidden" id="partnerPreview">
      <img id="partnerImg" alt="Partner card">
      <div class="cn" id="partnerName"></div>
      <button type="button" class="cmdr-clear" id="partnerClear">Clear</button>
    </div>
  </div>

  <div class="gametabs" id="gametabs"></div>
  <div id="gamePanels"></div>
</div>

<div class="footer">
  <div class="footerwrap">
    <div class="grand">Match total: <b id="grandTotal">0</b><span id="dqFlag" class="dqflag hidden">DQ</span></div>
    <div class="spacer"></div>
    <button class="act reset" id="resetBtn">Reset</button>
    <button class="act submit" id="submitBtn">Submit</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ---- Supabase config (ATLB3 League project) ----
const SUPABASE_URL = "https://qedwmpejzmgzgittfpuw.supabase.co";
const SUPABASE_KEY = "sb_publishable_MrxlVMTcVqPjcTzRemObGg_gis3bNOu";
const TABLE = "point_submissions";
const SCRYFALL = "https://api.scryfall.com";

// ---- Point definitions (mirrors the Google Sheet) ----
const SECTIONS = [
  { title: "Standard Points — available every league night", kind:"pos", items:[
    { key:"draw", val:1, desc:"Game ends in a draw (more than one player alive at round's end). 1pt each." },
    { key:"win_no_gc_solring", val:1, desc:"Win without playing a Game Changer or a T1 Sol Ring." },
    { key:"alt_win", val:1, desc:"Win or eliminate a player with an alternate win condition (poison, commander damage, milling, “win the game” cards). Once per match. No empty-library/Lab Man wins." },
    { key:"remove_counter_2plus", val:1, desc:"Remove or counter 2+ permanents/spells in a game with single-target removal/counters." },
    { key:"stop_win", val:1, desc:"Stop a win attempt (fog a lethal swing, counter a game-winning spell). Once per match. Be realistic." },
    { key:"protect_player", val:1, desc:"Protect another player from being killed. Once per game." },
    { key:"cast_cmdr_4x", val:1, desc:"Cast your commander from the command zone 4+ times. Excludes recasting infinites (Prossh). NOT Yuriko." },
    { key:"recent_ub_uw_cmdr", val:1, desc:"Have a commander from the most recent Universes Beyond / Universes Within set." },
    { key:"seat4_loss_or_3pod", val:1, desc:"Be in seat four and lose the game, or play in a three-player pod." },
    { key:"coolest_card", val:1, desc:"Coolest card played (all players vote). Most votes wins; no consensus = no point." },
  ]},
  { title: "Rotating Points — these change regularly", kind:"pos", items:[
    { key:"convoke_improvise_2", val:1, desc:"Cast 2 spells with Convoke, Improvise, Waterbending, or Teamwork." },
    { key:"team_creatures_5", val:1, desc:"Control 5+ unique non-token creature members of a team at once (Gatewatch, Fellowship, Avengers, Weatherlight crew)." },
    { key:"prepared_adventure_3", val:1, desc:"Cast a Prepared or Adventure spell three or more times." },
    { key:"lightning_bolted", val:1, desc:"Lightning Bolted! Kill a player with a direct-damage instant/sorcery when they are at 3 or less life." },
    { key:"lightning_bolt_range", val:1, desc:"Lightning Bolt range! Win or eliminate a player while your own life total is three or less." },
  ]},
  { title: "Bad Guy Points — don't do this stuff", kind:"neg", items:[
    { key:"win_before_t6", val:-4, desc:"Win the game before turn 6." },
    { key:"stax_4plus", val:-2, desc:"Control 4+ stax pieces at one time." },
    { key:"infinite_combo_win", val:-1, desc:"Win with an infinite combo." },
    { key:"edhtop16_cmdr", val:-1, desc:"Play a commander / commander pair on the front page of edhtop16.com." },
    { key:"infinite_loop_fail", val:-6, desc:"Present an infinite mana/draw loop and fail to end the game immediately." },
    { key:"acted_jerk", val:-2, desc:"Acted like a jerk. You know what you did." },
    { key:"mass_land_denial", dq:true, desc:"Mass Land Denial. (Disqualification)" },
    { key:"banned_card", dq:true, desc:"Play a banned card. (Disqualification)" },
    { key:"chain_extra_turns", dq:true, desc:"Chain Extra Turns. (Disqualification)" },
  ]},
];
const PLACEMENTS = [
  { label:"1st", val:4 }, { label:"2nd", val:3 }, { label:"3rd", val:2 }, { label:"4th", val:1 }, { label:"None", val:0 },
];
const GAMES = [1,2,3];

// state[game] = { placement:0, points:{key:bool} }
const state = {};
GAMES.forEach(g => state[g] = { placement:0, points:{} });
let activeGame = 1;

const $ = s => document.querySelector(s);
const panels = $("#gamePanels");
const tabs = $("#gametabs");

function buildTabs(){
  tabs.innerHTML = "";
  GAMES.forEach(g=>{
    const t = document.createElement("div");
    t.className = "gametab" + (g===activeGame ? " active":"");
    t.innerHTML = `Game ${g}<span class="gt-total" id="gttotal${g}"></span>`;
    t.onclick = ()=>{ activeGame=g; renderAll(); };
    tabs.appendChild(t);
  });
}

function buildPanel(g){
  const panel = document.createElement("div");
  panel.className = "gamepanel" + (g===activeGame ? "" : " hidden");

  // Placement
  const psec = document.createElement("div");
  psec.className = "section";
  psec.innerHTML = `<h2>Placement this match (skip if more than one player is alive at end)</h2>`;
  const pl = document.createElement("div");
  pl.className = "placement";
  PLACEMENTS.forEach(p=>{
    const b = document.createElement("div");
    b.className = "plbtn" + (state[g].placement===p.val ? " active":"");
    b.textContent = p.label + (p.val? ` (+${p.val})` : "");
    b.onclick = ()=>{ state[g].placement = p.val; renderAll(); };
    pl.appendChild(b);
  });
  psec.appendChild(pl);
  panel.appendChild(psec);

  // Point sections
  SECTIONS.forEach(sec=>{
    const s = document.createElement("div");
    s.className = "section";
    s.innerHTML = `<h2>${sec.title}</h2>`;
    sec.items.forEach(it=>{
      const on = !!state[g].points[it.key];
      const cls = it.dq ? "dq" : (it.val<0 ? "neg" : "pos");
      const row = document.createElement("div");
      row.className = `pt ${cls}` + (on ? " active":"");
      const valTxt = it.dq ? "DQ" : (it.val>0 ? "+"+it.val : it.val);
      row.innerHTML = `<div class="val ${it.dq?'dqval':''}">${valTxt}</div><div class="desc">${it.desc}</div>`;
      row.onclick = ()=>{ state[g].points[it.key] = !state[g].points[it.key]; renderAll(); };
      s.appendChild(row);
    });
    panel.appendChild(s);
  });
  return panel;
}

function itemByKey(key){
  for(const sec of SECTIONS) for(const it of sec.items) if(it.key===key) return it;
  return null;
}
function gameTotal(g){
  let total = state[g].placement, dq = false;
  for(const key in state[g].points){
    if(!state[g].points[key]) continue;
    const it = itemByKey(key);
    if(it.dq) dq = true; else total += it.val;
  }
  return { total, dq };
}
function matchTotals(){
  let total = 0, dq = false;
  GAMES.forEach(g=>{ const t = gameTotal(g); total += t.total; if(t.dq) dq = true; });
  return { total, dq };
}

function renderAll(){
  buildTabs();
  panels.innerHTML = "";
  GAMES.forEach(g=> panels.appendChild(buildPanel(g)));
  GAMES.forEach(g=>{
    const t = gameTotal(g);
    const el = document.getElementById("gttotal"+g);
    if(el) el.textContent = (t.dq ? "DQ" : (t.total>=0?"+":"") + t.total);
  });
  const m = matchTotals();
  $("#grandTotal").textContent = m.total;
  $("#dqFlag").classList.toggle("hidden", !m.dq);
}

function toast(msg, isErr){
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast show" + (isErr?" err":"");
  setTimeout(()=> t.className = "toast" + (isErr?" err":""), 3200);
}

// ---- Commander pickers (Scryfall autocomplete, commander-eligible only) ----
const commander = { name:"", id:"", image:"" };
const partner   = { name:"", id:"", image:"" };

function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }
function cardImage(card){
  if(card.image_uris) return card.image_uris.normal;
  if(card.card_faces && card.card_faces[0] && card.card_faces[0].image_uris) return card.card_faces[0].image_uris.normal;
  return "";
}

// Build a self-contained autocomplete picker bound to one input + preview + state object.
function makePicker(o){
  const input = $(o.input), drop = $(o.drop), prev = $(o.preview), img = $(o.img), nameEl = $(o.name), state = o.state;
  let seq = 0, index = -1, items = [], cache = {};

  function close(){ drop.classList.add("hidden"); drop.innerHTML = ""; items = []; index = -1; input.setAttribute("aria-expanded","false"); }
  function render(cards){
    items = cards; index = -1;
    if(!cards.length){ close(); return; }
    drop.innerHTML = "";
    cards.forEach(c=>{
      cache[c.name] = { id: c.id || "", image: cardImage(c) };
      const d = document.createElement("div");
      d.className = "ac-item"; d.setAttribute("role","option"); d.textContent = c.name;
      d.onmousedown = (e)=>{ e.preventDefault(); pick(c.name); };
      drop.appendChild(d);
    });
    drop.classList.remove("hidden"); input.setAttribute("aria-expanded","true");
  }
  // Scryfall search filtered to commander-eligible cards, ranked by EDHREC popularity.
  const run = debounce(async (q)=>{
    const my = ++seq;
    try{
      const url = `${SCRYFALL}/cards/search?q=${encodeURIComponent("is:commander "+q)}&order=edhrec&unique=cards`;
      const res = await fetch(url, { headers:{ "Accept":"application/json" } });
      if(my !== seq) return;
      if(res.status === 404){ render([]); return; }   // no commander matches
      if(!res.ok) return;
      const json = await res.json();
      if(my !== seq) return;
      render((json.data || []).slice(0, 12));
    }catch(e){ /* network hiccup — ignore */ }
  }, 200);

  async function pick(name){
    input.value = name; close();
    const c = cache[name];
    if(c){ state.name = name; state.id = c.id; state.image = c.image; }
    else{
      state.name = name; state.id = ""; state.image = "";
      try{
        const r = await fetch(`${SCRYFALL}/cards/named?exact=${encodeURIComponent(name)}`, { headers:{ "Accept":"application/json" } });
        if(r.ok){ const card = await r.json(); state.name = card.name || name; state.id = card.id || ""; state.image = cardImage(card); input.value = state.name; }
      }catch(e){}
    }
    show();
  }
  function show(){
    if(state.image){ img.src = state.image; img.style.display = ""; } else { img.removeAttribute("src"); img.style.display = "none"; }
    nameEl.textContent = state.name || "";
    prev.classList.toggle("hidden", !state.name);
  }
  function clear(){ state.name=""; state.id=""; state.image=""; input.value=""; prev.classList.add("hidden"); close(); }

  input.addEventListener("input", ()=>{
    const q = input.value.trim();
    if(state.name && q !== state.name){ state.name=""; state.id=""; state.image=""; prev.classList.add("hidden"); }
    if(q.length < 2){ close(); return; }
    run(q);
  });
  input.addEventListener("keydown", (e)=>{
    if(drop.classList.contains("hidden")) return;
    const els = [...drop.children];
    if(e.key === "ArrowDown"){ e.preventDefault(); index = Math.min(index+1, els.length-1); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); index = Math.max(index-1, 0); }
    else if(e.key === "Enter"){ if(index>=0){ e.preventDefault(); pick(items[index].name); } return; }
    else if(e.key === "Escape"){ close(); return; }
    els.forEach((el,i)=> el.classList.toggle("active", i===index));
  });
  input.addEventListener("blur", ()=> setTimeout(close, 120));
  if(o.clear) $(o.clear).onclick = clear;
  return { clear };
}

const cmdrPicker = makePicker({ input:"#commander", drop:"#acDropdown",  preview:"#cmdrPreview",    img:"#cmdrImg",    name:"#cmdrName",    clear:"#cmdrClear",    state:commander });
const partnerPicker = makePicker({ input:"#partner", drop:"#acDropdownP", preview:"#partnerPreview", img:"#partnerImg", name:"#partnerName", clear:"#partnerClear", state:partner });

function gameHasInput(g){
  if(state[g].placement) return true;
  return Object.values(state[g].points).some(Boolean);
}

// Build one Supabase row per game that has any input.
function buildRows(){
  const name = $("#fullName").value.trim();
  const date = $("#leagueDate").value || null;
  const cmdrName = commander.name || $("#commander").value.trim() || null;
  const partnerName = partner.name || $("#partner").value.trim() || null;
  const submissionId = crypto.randomUUID();
  const rows = [];
  GAMES.forEach(g=>{
    if(!gameHasInput(g)) return;
    const t = gameTotal(g);
    const row = {
      submission_id: submissionId,
      full_name: name,
      league_date: date,
      commander: cmdrName,
      commander_scryfall_id: commander.id || null,
      commander_image_url: commander.image || null,
      partner: partnerName,
      partner_scryfall_id: partner.id || null,
      partner_image_url: partner.image || null,
      game: g,
      placement: state[g].placement,
      dq: t.dq,
      game_total: t.total,
    };
    for(const sec of SECTIONS) for(const it of sec.items){
      const on = !!state[g].points[it.key];
      row[it.key] = it.dq ? on : (on ? it.val : 0);
    }
    rows.push(row);
  });
  return rows;
}

$("#submitBtn").onclick = async ()=>{
  const name = $("#fullName").value.trim();
  if(!name){ toast("Enter a player name first.", true); $("#fullName").focus(); return; }
  const rows = buildRows();
  if(rows.length === 0){ toast("Mark at least one point before submitting.", true); return; }
  const btn = $("#submitBtn");
  btn.disabled = true; btn.textContent = "Submitting…";
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Prefer": "return=minimal",
      },
      body: JSON.stringify(rows),
    });
    if(!res.ok){ throw new Error(await res.text() || ("HTTP "+res.status)); }
    toast(`Saved ${rows.length} game${rows.length>1?"s":""} for ${name} ✓`);
    doReset(true);
  }catch(e){
    toast("Could not save: "+e.message, true);
  }finally{
    btn.disabled = false; btn.textContent = "Submit";
  }
};

function doReset(keepMeta){
  GAMES.forEach(g=>{ state[g] = { placement:0, points:{} }; });
  activeGame = 1;
  if(!keepMeta){ $("#fullName").value = ""; cmdrPicker.clear(); partnerPicker.clear(); }
  renderAll();
}
$("#resetBtn").onclick = ()=> doReset(false);

// default date = today
$("#leagueDate").value = new Date().toISOString().slice(0,10);
renderAll();
</script>
</body>
</html>
