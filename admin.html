<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — ATL B3 Commander League</title>
<meta name="description" content="League admin: review and remove submitted game results.">
<link rel="stylesheet" href="/theme.css">
<script
  async
  crossorigin="anonymous"
  data-clerk-publishable-key="pk_live_Y2xlcmsucmVkaXJlY3RsaWdodG5pbmcuY29tJA"
  src="https://clerk.redirectlightning.com/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
  type="text/javascript"
></script>
<style>
  html{scroll-behavior:smooth}
  .page-head{max-width:var(--maxw); margin:0 auto; padding:48px 22px 8px}
  .page-head h1{font-size:clamp(28px,4vw,40px); color:var(--gold-2)}
  .page-head p{margin:12px 0 0; color:var(--ink-dim); max-width:640px}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:22px}
  .dot.warn{background:var(--bad); box-shadow:0 0 9px rgba(224,96,90,.6)}
  #authGate, #deniedGate{padding-top:8px}
  #authGate p, #deniedGate p{color:var(--ink-dim); font-family:system-ui,sans-serif; margin:0 0 16px; text-align:center}
  #clerkSignIn{max-width:400px; margin:0 auto}
  table.stand td{text-align:left; font-family:system-ui,sans-serif; font-size:13.5px; white-space:normal}
  table.stand td.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
  table.stand td.dq{color:var(--bad); font-weight:700}
  .del-btn{
    font:600 12px/1 system-ui,sans-serif; letter-spacing:.03em; color:var(--bad);
    background:rgba(224,96,90,.1); border:1px solid rgba(224,96,90,.4); border-radius:6px;
    padding:6px 10px; cursor:pointer; white-space:nowrap;
  }
  .del-btn:hover{background:rgba(224,96,90,.2); border-color:var(--bad)}
  .del-btn:disabled{opacity:.5; cursor:default}
</style>
</head>
<body>

<nav>
  <div class="nav-in">
    <a class="brand" href="/">
      <span class="pips"><i class="pip w"></i><i class="pip u"></i><i class="pip b"></i><i class="pip r"></i><i class="pip g"></i></span>
      ATL B3
    </a>
    <button class="burger" id="burger" type="button"
            aria-label="Open menu" aria-expanded="false" aria-controls="nav-links">
      <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
    <div class="nav-links" id="nav-links">
      <a href="/">Home</a>
      <a href="/#standings">Standings</a>
      <a href="/#scoring">Scoring</a>
      <a href="/#points">Points Sheet</a>
      <a href="/#deck">Points Deck</a>
      <a href="/commanders">Commanders</a>
      <a href="/#faq">FAQ</a>
      <a class="cta" href="/formsubmission">Submit Scores</a>
    </div>
    <div id="clerkUserButton"></div>
  </div>
</nav>

<div class="page-head">
  <h1>Admin</h1>
  <p>Review submitted game results and remove test/junk rows. Visible to league admins only.</p>
</div>

<div class="wrap hidden" id="authGate">
  <p>Sign in to continue.</p>
  <div id="clerkSignIn"></div>
</div>

<div class="wrap hidden" id="deniedGate">
  <p>Your account doesn't have admin access to this page.</p>
</div>

<div class="wrap hidden" id="adminContent">
  <div class="status" id="st-admin">
    <span class="dot" id="dot-admin"></span>
    <span id="msg-admin">Loading submissions&hellip;</span>
  </div>
  <div class="tools">
    <input id="admin-search" type="search" placeholder="Search name, email, or commander&hellip;" autocomplete="off">
    <span class="count" id="admin-count"></span>
  </div>
  <div class="table-scroll" id="admin-out"></div>
</div>

<script src="/auth.js"></script>
<script>
const $ = (s) => document.querySelector(s);

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let ROWS = [];
let ClerkRef = null;

function setStatus(state, msg){
  $('#dot-admin').className = 'dot ' + state;
  $('#msg-admin').textContent = msg;
}

function renderTable(){
  const q = $('#admin-search').value.trim().toLowerCase();
  const list = !q ? ROWS : ROWS.filter(r =>
    (r.full_name || '').toLowerCase().includes(q) ||
    (r.submitted_by_email || '').toLowerCase().includes(q) ||
    (r.commander || '').toLowerCase().includes(q) ||
    (r.partner || '').toLowerCase().includes(q)
  );

  $('#admin-count').textContent = list.length === ROWS.length
    ? ROWS.length + ' submissions'
    : list.length + ' of ' + ROWS.length + ' submissions';

  const host = $('#admin-out');
  if (!list.length){
    host.innerHTML = '<p class="empty">No submissions match.</p>';
    return;
  }

  host.innerHTML =
      '<table class="stand"><thead><tr>'
    +   '<th>Name</th><th>Email</th><th>Date</th><th>G</th><th>Placement</th>'
    +   '<th>Total</th><th>DQ</th><th>Commander</th><th></th>'
    + '</tr></thead><tbody>'
    + list.map(r => (
        '<tr data-id="' + r.id + '">'
        + '<td>' + esc(r.full_name || '') + '</td>'
        + '<td>' + esc(r.submitted_by_email || '') + '</td>'
        + '<td>' + esc(r.league_date || '') + '</td>'
        + '<td class="num">' + r.game + '</td>'
        + '<td class="num">' + r.placement + '</td>'
        + '<td class="num">' + r.game_total + '</td>'
        + '<td class="num' + (r.dq ? ' dq' : '') + '">' + (r.dq ? 'DQ' : '') + '</td>'
        + '<td>' + esc([r.commander, r.partner].filter(Boolean).join(' + ')) + '</td>'
        + '<td class="num"><button type="button" class="del-btn" data-id="' + r.id + '">Delete</button></td>'
        + '</tr>'
      )).join('')
    + '</tbody></table>';
}

async function loadSubmissions(){
  setStatus('', 'Loading submissions…');
  try{
    const token = await ClerkRef.session.getToken();
    const res = await fetch('/api/admin/submissions', { headers: { 'Authorization': 'Bearer ' + token } });
    if (!res.ok) throw new Error((await res.json().catch(()=>({}))).error || ('HTTP ' + res.status));
    ROWS = await res.json();
    renderTable();
    setStatus('live', ROWS.length + ' submissions loaded');
  }catch(e){
    console.error('[admin]', e);
    setStatus('warn', 'Could not load submissions — ' + e.message);
  }
}

$('#admin-search').addEventListener('input', () => {
  clearTimeout(window.__adminSearchT);
  window.__adminSearchT = setTimeout(renderTable, 120);
});

$('#admin-out').addEventListener('click', async (e) => {
  const btn = e.target.closest('.del-btn');
  if (!btn) return;
  const id = btn.dataset.id;
  const row = ROWS.find(r => String(r.id) === String(id));
  const label = row ? (row.full_name + ' — ' + (row.commander || 'no commander')) : ('#' + id);
  if (!confirm('Delete submission for ' + label + '? This cannot be undone.')) return;

  btn.disabled = true; btn.textContent = 'Deleting…';
  try{
    const token = await ClerkRef.session.getToken();
    const res = await fetch('/api/admin/submissions/' + id, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
    if (!res.ok) throw new Error((await res.json().catch(()=>({}))).error || ('HTTP ' + res.status));
    ROWS = ROWS.filter(r => String(r.id) !== String(id));
    renderTable();
  }catch(e){
    alert('Could not delete: ' + e.message);
    btn.disabled = false; btn.textContent = 'Delete';
  }
});

let loadedOnce = false;
initClerk((Clerk, signedIn) => {
  ClerkRef = Clerk;
  const isAdmin = signedIn && Clerk.user?.publicMetadata?.role === 'admin';

  $('#authGate').classList.toggle('hidden', signedIn);
  $('#deniedGate').classList.toggle('hidden', !signedIn || isAdmin);
  $('#adminContent').classList.toggle('hidden', !isAdmin);

  const signInEl = $('#clerkSignIn');
  if (signedIn){
    signInEl.innerHTML = '';
  } else if (!window.__signInMounted){
    Clerk.mountSignIn(signInEl);
    window.__signInMounted = true;
  }

  if (isAdmin && !loadedOnce){
    loadedOnce = true;
    loadSubmissions();
  }
});
</script>
<script src="/nav.js"></script>
</body>
</html>
